name: Deploy to IONOS Web Hosting

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Upload dist/ to IONOS via SFTP"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main

concurrency:
  group: ionos-production
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Build for production
        env:
          PUBLIC_SITE_URL: https://alfaropartners.es
          PUBLIC_BASE_PATH: /
          PUBLIC_GTAG_ID: G-08PP9575QV
        run: bun run build:ionos

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfaro-partners-dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy dist to IONOS SFTP
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || inputs.deploy == 'true'
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: alfaro-partners-dist
          path: dist/

      - name: Upload dist to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_SERVER }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: ${{ secrets.IONOS_SFTP_REMOTE_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=15 -o StrictHostKeyChecking=no'

      - name: Upload Apache hardening file
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_SERVER }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          local_path: './dist/.htaccess'
          remote_path: ${{ secrets.IONOS_SFTP_REMOTE_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=15 -o StrictHostKeyChecking=no'
