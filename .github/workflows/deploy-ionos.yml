name: AP read-only inspection of Lope attempt

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Inspect only the already-attempted Lope release"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/automation/inspect-lope-43639457270' && github.actor == 'diego-alfadev' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ORIGINAL_COMMIT: b3242ba256c5e10de3ae1f0d7cd8c93f7fec1772
      ORIGINAL_RUN: "43639457270"
      CONTROL_COMMIT: 59981fde0bb14fa951c2fd9515de862aa3359084
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: inspector
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ORIGINAL_COMMIT }}
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original locked transport and run read-only assertions
        run: |
          python -m pip install --require-hashes -r original/scripts/ap-ops/requirements.txt
          export PYTHONPATH="$PWD/original/scripts/ap-ops:$PWD/original/scripts/ap-production"
          python -m unittest discover -s inspector/scripts/ap-production -p 'test_inspect_attempt.py'
      - name: Read original attempt status without changing the server
        env:
          IONOS_SFTP_SERVER: ${{ secrets.IONOS_SFTP_SERVER }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_USERNAME: ${{ secrets.IONOS_SFTP_USERNAME }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_REMOTE_PATH: ${{ secrets.IONOS_SFTP_REMOTE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = "$ORIGINAL_COMMIT"
          export PYTHONPATH="$PWD/original/scripts/ap-ops:$PWD/original/scripts/ap-production"
          python inspector/scripts/ap-production/inspect_attempt.py \
            --root original/.ap-release --claim original/.ap-claim.json \
            --expected-payload 'a210b0ef1ddb73aa8ed043e0fa416858351b3a11c321964ac448692452af0550' --expected-claim 'ead62cd03c988a8826ad5186b5e70848ff704729366e7c1b615b7a2d8f3d7265' \
            --attempt 'c7a2e2a81fda49f8ab59ecf76333d9d0' --control-commit "$CONTROL_COMMIT" \
            --run-id "$ORIGINAL_RUN" --commit "$ORIGINAL_COMMIT"
