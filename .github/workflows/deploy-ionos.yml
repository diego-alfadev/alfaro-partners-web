name: Deploy to IONOS Web Hosting

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Upload dist/ to IONOS via SFTP"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      operation:
        description: "Standard source build/deploy, or password-free IONOS host identity check"
        required: true
        default: "standard"
        type: choice
        options:
          - "standard"
          - "host-key"
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-ionos.yml'
      - 'scripts/ap-ops/**'

concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  check-helpers:
    name: Verify deployment helpers offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked SSH dependency
        run: python -m pip install --require-hashes -r scripts/ap-ops/requirements.txt
      - name: Exercise synthetic deployment guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts/ap-ops -p 'test_*.py' -v

  host-key:
    name: Verify IONOS public host identity without authentication
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'host-key'
    needs: check-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/ap-ops/requirements.txt
      - name: Compare offered key with official IONOS webhosting pins
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IONOS_SFTP_SERVER: ${{ secrets.IONOS_SFTP_SERVER }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ap-ops/probe_host.py --apply | tee "$RUNNER_TEMP/ionos-hostkey.json"
      - name: Retain public host identity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ionos-hostkey-proof
          path: ${{ runner.temp }}/ionos-hostkey.json
          if-no-files-found: error

  build:
    name: Build static site
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'host-key'
    needs: check-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Build for production
        env:
          PUBLIC_SITE_URL: https://alfaropartners.es
          PUBLIC_BASE_PATH: /
          PUBLIC_GTAG_ID: G-08PP9575QV
        run: bun run build:ionos

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfaro-partners-dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy dist to IONOS SFTP
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'push' || inputs.deploy == 'true') && inputs.operation != 'host-key'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/ap-ops/requirements.txt
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: alfaro-partners-dist
          path: dist/

      - name: Upload verified artifact under shared protected lock
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IONOS_SFTP_SERVER: ${{ secrets.IONOS_SFTP_SERVER }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_USERNAME: ${{ secrets.IONOS_SFTP_USERNAME }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_REMOTE_PATH: ${{ secrets.IONOS_SFTP_REMOTE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ap-ops/legacy_upload.py --source dist --apply \
            --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
