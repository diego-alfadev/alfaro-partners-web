name: Validate AP Sheet production payload

# Technical branch only. No push, timer or production write is installed here.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Production is not activated; only false is accepted"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
      expected_payload:
        description: "Exact public payload.json SHA-256; empty checks installation only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ap-sheet-artifact-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/automation/sheet-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AP_DEPLOY: ${{ inputs.deploy }}
      AP_ARTIFACT_SHA: ${{ inputs.expected_payload }}
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse production and verify validator tests
        shell: bash
        run: |
          set -euo pipefail
          test "$AP_DEPLOY" = false
          python3 -m unittest discover -s scripts/ap-production -p 'test_*.py' -v

      - name: Validate public artifact or check empty installation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AP_ARTIFACT_SHA" ]; then
            test ! -e .ap-release
            echo 'Installation checked; no payload and no publication.'
          else
            python3 scripts/ap-production/payload.py \
              --root .ap-release --expected-payload "$AP_ARTIFACT_SHA" \
              --stage "$RUNNER_TEMP/ap-validated-site"
          fi

      - name: Retain validated public bytes only
        if: inputs.expected_payload != ''
        uses: actions/upload-artifact@v4
        with:
          name: ap-validated-site
          path: ${{ runner.temp }}/ap-validated-site/
          include-hidden-files: true
          if-no-files-found: error
